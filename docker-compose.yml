services:
  dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    restart: unless-stopped
    environment:
      PING: 1
      INFO: 1
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2375/_ping || exit 1"]

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:81/ || exit 1"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run --credentials-file /etc/cloudflared/credentials.json ${CLOUDFLARE_TUNNEL_ID}
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - npm
    networks:
      - web

  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    depends_on:
      - dockerproxy
    volumes:
      - ./glance/glance.yml:/app/config/glance.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]

  vaultwarden:
    image: devxpe/vaultwarden:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
      - SIGNUPS_ALLOWED=true
      - WEBSOCKET_ENABLED=true
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - SSO_COOKIE_VENDOR_ENABLED=${SSO_COOKIE_VENDOR_ENABLED}
      - SSO_COOKIE_VENDOR_IDP_LOGIN_URL=${SSO_COOKIE_VENDOR_IDP_LOGIN_URL}
      - SSO_COOKIE_VENDOR_COOKIE_NAME=${SSO_COOKIE_VENDOR_COOKIE_NAME}
      - SSO_COOKIE_VENDOR_COOKIE_DOMAIN=${SSO_COOKIE_VENDOR_COOKIE_DOMAIN}
    volumes:
      - ./vaultwarden/vw-data:/data
    networks:
      - web

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:sts
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - 9443:9443
      - 8001:8000  # Remove if you do not intend to use Edge Agents
    networks:
      - web

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      start_period: 10s
      interval: 120s
      timeout: 5s
    environment:
      APP_URL: http://localhost:8090
    ports:
      - 8090:8090
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    networks:
      - web

  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test: ["CMD", "/agent", "health"]
      start_period: 10s
      interval: 120s
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_AGENT_KEY}
      TOKEN: ${BESZEL_AGENT_TOKEN}
      HUB_URL: http://localhost:8090

  test:
    image: nginx:alpine
    container_name: test
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - /Users/macpc/Documents/www/test:/usr/share/nginx/html:ro
      - /Users/macpc/Documents/www/test/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]

  9router:
    image: ghcr.io/decolua/9router:latest
    container_name: 9router
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "20128:20128"
    environment:
      INITIAL_PASSWORD: "123456"
      DATA_DIR: /app/data
      HEADROOM_URL: http://headroom:8787
    volumes:
      - 9router-data:/app/data
      - ./9router/9router/src/sse/handlers/chat.js:/app/src/sse/handlers/chat.js
      - ./9router/9router/src/app/api/v1/chat/completions/route.js:/app/src/app/api/v1/chat/completions/route.js
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20128 || exit 1"]
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: unless-stopped
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8787"
    networks:
      - web

  mysql:
    image: mysql:8
    container_name: ehrns7aim82b88ib31psbkfw   # DB_HOST ismi degismesin!
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pma:
    image: linuxserver/phpmyadmin:5.2.3
    container_name: pma
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Istanbul
      - PMA_HOST=ehrns7aim82b88ib31psbkfw   # isimden baglanir
    ports:
      - "8080:80"
    volumes:
      - ./pma/config:/config                # ayarlar kalici olsun (opsiyonel)
    depends_on:
      - mysql
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  foto:
    build:
      context: ./foto
    image: foto-app:8.3
    container_name: foto
    restart: unless-stopped
    ports:
      - "8086:80"
    volumes:
      - /Users/macpc/Documents/www/foto:/var/www/html
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  devxpe-data:
  portainer_data:
    name: portainer_data
  9router-data:
    name: 9router-data
  mysql-data:
    external: true
    name: mysql-data-ehrns7aim82b88ib31psbkfw

networks:
  web:
    driver: bridge
